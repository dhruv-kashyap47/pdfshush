name: CI

# The Cloudflare-only gates: typecheck, the unit suites, a production build and
# the bundle boundary. The server tier (Express, BullMQ, Redis, Mongo) lives in
# `archive/` and is not installed, built or tested here. Browser E2E suites run
# separately against the built preview, as documented in README.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck + unit + bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Reads `packageManager` from package.json (pnpm 12), so the CI pin and
      # the local pin cannot drift apart.
      - uses: pnpm/action-setup@v4

      # One version source: `.node-version` (24). setup-node@v5 is the current
      # major; v4 is deprecated on the Node 24 runtime.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # A Git-connected Workers Build reads wrangler.jsonc from the branch it
      # watches. Catch the placeholder D1 id and a frontend-only build here,
      # before a deploy can fail with an opaque Cloudflare error.
      - run: pnpm test:deploy-config

      - run: pnpm test:provenance

      # The dependency notice is generated from the lockfile's installed
      # packages. If a bump adds a licence (or a package stops shipping its
      # notice), the diff is the review trigger rather than a silent release.
      - run: pnpm deps:licenses
      - run: git diff --exit-code THIRD_PARTY_LICENSES.deps.md

      # G-05: no document text in logs, bounded local drafts, no off-origin
      # fetches, complete rail registry. The second run plants a violation in
      # each scanner so a green tree is not mistaken for a blind guard.
      - run: pnpm test:guardrails

      - run: pnpm test

      # H-04: the seeded fuzz is part of `pnpm test`, but a named step makes a
      # hang or crash on a hostile stream obvious in the CI log.
      - run: pnpm test:fuzz

      # H-03: editor ceilings. Unit-speed, no browser or stack required.
      - run: pnpm test:editor-perf
        env:
          EDITOR_BENCH_CI: '1'

      # `pnpm build` is the web build; `test:bundle` scans the chunks it emits.
      - run: pnpm build

      - run: pnpm test:bundle

  # Q3/Q7 is a browser measurement, not a unit test. It needs no Worker,
  # only the production build and Chromium. CI uses the public spec ceilings
  # (`M5_PERF_CI=1`); the tighter ratified numbers are measured locally on the
  # machine that produced them, because a shared runner is not that machine.
  perf:
    name: Q3/Q7 ceilings (spec)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      M5_PERF_CI: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--with-deps` shells out to apt. A transient DNS failure on the Ubuntu
      # mirror used to fail the whole job before a single test ran, so let apt
      # retry its own downloads and retry the whole step a few times.
      - name: Install browsers
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::Playwright install failed (attempt ${attempt}/3); retrying in 20s"
            sleep 20
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1
      - run: pnpm build
      - name: Start preview
        run: |
          pnpm --filter @pdfshush/web preview --port 4173 &
          node scripts/wait-for-url.mjs http://localhost:4173
      - run: pnpm test:perf
      - run: pnpm test:e2e:a11y
      - run: pnpm test:e2e:account-avatar
      - run: pnpm test:e2e:keyboard
      - name: Cross-browser editor loop
        run: pnpm test:e2e:cross-browser
        env:
          E2E_BASE_URL: http://localhost:4173
      - name: Touch/mobile editor loop
        run: pnpm test:e2e:editor-touch
        env:
          E2E_BASE_URL: http://localhost:4173
      - name: Text UX, find/replace and draft recovery
        run: pnpm test:e2e:text-ux
        env:
          E2E_BASE_URL: http://localhost:4173
      - name: Rail-entry registry smoke
        run: pnpm test:e2e:editor-rail
        env:
          E2E_BASE_URL: http://localhost:4173
      - run: pnpm test:e2e:verify
      - run: pnpm test:e2e:reach
      - run: pnpm test:e2e:offline
