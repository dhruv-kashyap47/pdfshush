# PDFShush server stack (Phase 3).
#
# Three services, one network:
#   redis    -- the queue broker (state only: no PDF bytes ever enter it)
#   api      -- Express + BullMQ producer + the TTL janitor
#   worker   -- BullMQ consumers; jobs run in sandboxed child processes
#
# PDF bytes live in the shared `work` volume, mounted at the same path in both
# processes, so the worker can find what the API uploaded. The janitor in both
# containers is what makes "kill -9 leaves nothing behind" true.
#
# Bring it up with:  docker compose up -d --build

services:
  redis:
    image: redis:7-alpine
    # Bounded memory: the queue holds paths and counters, never documents.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      WORK_DIR: /data/work
      EMBEDDED_WORKER: "false"
      WORKER_CONCURRENCY: "2"
      # How long job files may sit before the janitor removes them, and how
      # often it looks. Overridable so the hardening gate can watch a sweep.
      FILE_TTL_MS: ${FILE_TTL_MS:-3600000}
      JANITOR_INTERVAL_MS: ${JANITOR_INTERVAL_MS:-300000}
      LOG_LEVEL: info
      # Accounts (Phase 4). Compose reads the project-root `.env` for these, so
      # credentials are never baked into the image. Auth stays off unless a Mongo
      # URI *and* both Google values resolve; every tool is anonymous regardless.
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-pdfshush}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/callback}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      # Secure cookies over http://localhost are accepted by Chrome and Edge
      # (localhost is a trustworthy origin), so the secure default holds locally.
      # Set SESSION_COOKIE_SECURE=false only if a browser refuses the cookie.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Managed AI (Phase 5). The four strings are safe to pass empty: `ai.enabled`
      # is decided by a truthy model *and* key, so a deployment with neither boots
      # BYOK-only, exactly as before. The budget numbers are deliberately NOT
      # listed here -- they are `z.coerce.number().positive()`, and an empty
      # string coerces to 0 and fails validation, which makes the API refuse to
      # boot. They arrive through `env_file` below when the operator sets them.
      AI_MANAGED_PROVIDER: ${AI_MANAGED_PROVIDER:-openai}
      AI_MANAGED_MODEL: ${AI_MANAGED_MODEL:-}
      AI_MANAGED_API_KEY: ${AI_MANAGED_API_KEY:-}
      AI_MANAGED_BASE_URL: ${AI_MANAGED_BASE_URL:-}
    # Anything else in the project-root `.env` reaches the container too, so
    # optional knobs (AI budget overrides, TTLs) can be set without this file
    # listing each one. A key that is absent from `.env` is simply absent here,
    # which is what keeps every schema default in force; `required: false` keeps
    # a fresh clone (no `.env`) working.
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - work:/data/work
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["node", "dist/worker-host.js"]
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      WORK_DIR: /data/work
      WORKER_CONCURRENCY: "2"
      FILE_TTL_MS: ${FILE_TTL_MS:-3600000}
      JANITOR_INTERVAL_MS: ${JANITOR_INTERVAL_MS:-300000}
      LOG_LEVEL: info
    volumes:
      - work:/data/work
    depends_on:
      redis:
        condition: service_healthy
    # The image's HEALTHCHECK curls /api/health, which only `server.js` serves.
    # This container runs worker-host.js, which opens no HTTP listener, so the
    # inherited probe could never pass and the container reported permanently
    # unhealthy. Probe what this process actually depends on instead: Docker only
    # runs a probe while the container is up, so the open question is whether it
    # can still reach its broker -- a worker that cannot reach Redis consumes
    # nothing.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const R=require('ioredis');const r=new
          R(process.env.REDIS_URL,{connectTimeout:2000,lazyConnect:true,retryStrategy:()=>null});
          r.on('error',()=>{});r.connect().then(()=>r.ping()).then(()=>r.quit())
          .then(()=>process.exit(0)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 3
    # The hardening gate kills this container mid-job on purpose; the volume and
    # the queue must survive it.
    restart: unless-stopped

volumes:
  work: