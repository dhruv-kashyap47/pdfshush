<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">PDFShush: every PDF tool, zero uploads</title>
  <desc id="heroDesc">An animated illustration of a PDF being signed, redacted and processed on a laptop. Floating tool chips read Merge PDF, Sign and fill, and OCR. A badge reads zero uploads.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130f"/>
      <stop offset="0.52" stop-color="#0a1b14"/>
      <stop offset="1" stop-color="#06100c"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3ecf8e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3ecf8e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e7c98b" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#e7c98b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#9fd6bb" opacity="0.10"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="175%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="chipShadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .eyebrow { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 3.6px; fill: #74c9a0; }
      .h1 { font: 400 56px Georgia, 'Times New Roman', serif; fill: #f5f0e4; }
      .h1-green { fill: #63d3a0; }
      .body { font: 400 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a9bcb1; }
      .pilltext { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #dcebe2; letter-spacing: 0.2px; }
      .chip { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #d8f3e5; letter-spacing: 0.2px; }
      .docname { font: 600 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2a3a31; }
      .doclabel { font: 600 9px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9a9383; letter-spacing: 1.4px; }
      .foot { font: 600 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2f7a58; letter-spacing: 0.2px; }
      .bignum { font: 600 28px Georgia, 'Times New Roman', serif; fill: #f5f0e4; }
      .badgelabel { font: 600 9px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8fd7b2; letter-spacing: 1.6px; }
      .footnote { font: 500 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6f8a7c; letter-spacing: 1.2px; }

      .float { animation: float 7s ease-in-out infinite; }
      .float-slow { animation: float 9.5s ease-in-out infinite; }
      .float-rev { animation: floatRev 8s ease-in-out infinite; }
      .drift { animation: drift 17s ease-in-out infinite alternate; }
      .drift-2 { animation: drift2 21s ease-in-out infinite alternate; }
      .rise { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      .d1 { animation-delay: 0.10s; }
      .d2 { animation-delay: 0.25s; }
      .d3 { animation-delay: 0.40s; }
      .d4 { animation-delay: 0.55s; }
      .d5 { animation-delay: 0.70s; }
      .d6 { animation-delay: 0.85s; }
      .d7 { animation-delay: 1.00s; }
      .d8 { animation-delay: 1.15s; }
      .d9 { animation-delay: 1.30s; }

      .redact {
        transform-box: fill-box;
        transform-origin: left center;
        animation: redact 6.5s cubic-bezier(0.7, 0, 0.2, 1) 1.2s infinite;
      }
      .check {
        transform-box: fill-box;
        transform-origin: center;
        animation: check 6.5s ease-out 1.2s infinite;
      }
      .draw {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: draw 6.5s ease-in-out 1.2s infinite;
      }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
      .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
      .twinkle-2 { animation-delay: 1.8s; }

      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes floatRev { 0%, 100% { transform: translateY(-7px); } 50% { transform: translateY(4px); } }
      @keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(46px, -26px); } }
      @keyframes drift2 { 0% { transform: translate(0, 0); } 100% { transform: translate(-38px, 30px); } }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes redact {
        0% { transform: scaleX(0); opacity: 1; }
        13% { transform: scaleX(1); opacity: 1; }
        72% { transform: scaleX(1); opacity: 1; }
        80% { transform: scaleX(1); opacity: 0; }
        100% { transform: scaleX(0); opacity: 0; }
      }
      @keyframes check {
        0%, 18% { opacity: 0; transform: scale(0.55); }
        27%, 72% { opacity: 1; transform: scale(1); }
        80%, 100% { opacity: 0; transform: scale(0.55); }
      }
      @keyframes draw {
        0%, 12% { stroke-dashoffset: 1; }
        32%, 78% { stroke-dashoffset: 0; }
        88%, 100% { stroke-dashoffset: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.82); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.75) rotate(0deg); }
        50% { opacity: 0.95; transform: scale(1.08) rotate(22deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .float, .float-slow, .float-rev, .drift, .drift-2, .rise,
        .redact, .check, .draw, .pulse, .spin, .twinkle { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#dots)"/>

  <g class="drift" opacity="0.9">
    <circle cx="230" cy="120" r="260" fill="url(#glowGreen)"/>
  </g>
  <g class="drift-2" opacity="0.9">
    <circle cx="1010" cy="430" r="300" fill="url(#glowGreen)"/>
  </g>
  <circle cx="880" cy="120" r="230" fill="url(#glowGold)"/>

  <!-- Left: the promise -->
  <g class="rise d1">
    <text x="72" y="96" class="eyebrow">PRIVATE PDF TOOLKIT</text>
  </g>
  <g class="rise d2">
    <text x="70" y="176" class="h1">Every tool.</text>
  </g>
  <g class="rise d3">
    <text x="70" y="238" class="h1 h1-green">Zero uploads.</text>
  </g>
  <g class="rise d4">
    <text x="72" y="292" class="body">Merge, sign, redact and OCR a PDF</text>
    <text x="72" y="318" class="body">without it ever leaving your device.</text>
  </g>

  <g class="rise d5">
    <rect x="72" y="354" width="204" height="42" rx="21" fill="#0c2018" stroke="#2f7a58" stroke-opacity="0.55"/>
    <circle cx="94" cy="375" r="4" fill="#3ecf8e"/>
    <text x="108" y="380" class="pilltext">48 browser tools</text>

    <rect x="292" y="354" width="148" height="42" rx="21" fill="#0c2018" stroke="#2f7a58" stroke-opacity="0.55"/>
    <circle cx="314" cy="375" r="4" fill="#3ecf8e"/>
    <text x="328" y="380" class="pilltext">0 uploads</text>

    <rect x="456" y="354" width="170" height="42" rx="21" fill="#0c2018" stroke="#2f7a58" stroke-opacity="0.55"/>
    <circle cx="478" cy="375" r="4" fill="#3ecf8e"/>
    <text x="492" y="380" class="pilltext">Works offline</text>
  </g>

  <g class="rise d6">
    <text x="72" y="452" class="footnote">FREE · OPEN SOURCE · NO ACCOUNT</text>
  </g>

  <!-- Right: the document doing the work -->
  <g class="rise d4">
    <circle cx="906" cy="262" r="236" fill="none" stroke="#3ecf8e" stroke-opacity="0.13" stroke-width="1.5" stroke-dasharray="2 10"/>
    <g class="spin">
      <circle cx="906" cy="262" r="236" fill="none" stroke="#3ecf8e" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="2 10"/>
    </g>
  </g>

  <!-- Paper stack -->
  <g transform="rotate(-9 900 262)">
    <g class="float-slow">
      <rect x="748" y="96" width="300" height="350" rx="16" fill="#d8d0bd" opacity="0.16"/>
    </g>
  </g>
  <g transform="rotate(-4.5 900 262)">
    <g class="float-rev">
      <rect x="774" y="80" width="300" height="352" rx="16" fill="#eee6d6" opacity="0.28"/>
    </g>
  </g>

  <g transform="translate(804, 62)">
    <g class="float">
      <rect x="0" y="0" width="300" height="358" rx="16" fill="#fbf7ed" filter="url(#cardShadow)"/>

      <!-- header -->
      <circle cx="26" cy="30" r="5" fill="#e06a5a"/>
      <text x="40" y="35" class="docname">contract.pdf</text>
      <g opacity="0.5">
        <rect x="258" y="22" width="14" height="11" rx="2" fill="none" stroke="#5f7a6b" stroke-width="1.4"/>
        <path d="M261 22 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#5f7a6b" stroke-width="1.4"/>
      </g>
      <line x1="24" y1="52" x2="276" y2="52" stroke="#e4ddcd" stroke-width="1"/>

      <!-- body copy -->
      <rect x="24" y="72" width="196" height="7" rx="3.5" fill="#ded7c6"/>
      <rect x="24" y="92" width="228" height="7" rx="3.5" fill="#ded7c6"/>
      <rect x="24" y="112" width="170" height="7" rx="3.5" fill="#ded7c6"/>
      <rect x="24" y="132" width="214" height="7" rx="3.5" fill="#ded7c6"/>

      <!-- redaction sweeps across the middle -->
      <g class="redact">
        <rect x="22" y="86" width="232" height="38" rx="3" fill="#101713"/>
      </g>
      <g class="check">
        <circle cx="240" cy="105" r="13" fill="#2f9e6a"/>
        <path d="M234 105 l4 4 l8 -9" fill="none" stroke="#f4efe4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- signature -->
      <text x="24" y="176" class="doclabel">SIGNATURE</text>
      <path class="draw" pathLength="1" d="M24 202 c12 -20 22 14 32 -2 s18 -14 28 2 s16 8 26 -4 s14 -6 22 2" fill="none" stroke="#2f7a58" stroke-width="2.2" stroke-linecap="round"/>

      <!-- footer -->
      <path d="M0 296 H300 V342 A16 16 0 0 1 284 358 H16 A16 16 0 0 1 0 342 Z" fill="#e9f5ee"/>
      <path d="M20 318 h10 v9 h-10 z" fill="none" stroke="#2f7a58" stroke-width="1.4"/>
      <path d="M23 318 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#2f7a58" stroke-width="1.4"/>
      <text x="40" y="330" class="foot">Processed on this device</text>
      <circle cx="262" cy="323" r="4" fill="#3ecf8e" class="pulse"/>
    </g>
  </g>

  <!-- zero-uploads badge -->
  <g class="rise d6">
    <g transform="translate(1102, 92)">
      <g class="spin">
        <circle r="46" fill="none" stroke="#3b8f6a" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="3 7"/>
      </g>
      <circle r="37" fill="#0c2118" stroke="#2f7a58" stroke-opacity="0.8"/>
      <g transform="translate(-9, -28)">
        <path d="M9 0 L18 4 V11 C18 17 14 21 9 23 C4 21 0 17 0 11 V4 Z" fill="none" stroke="#7fe0b4" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M5.5 11.5 L8 14 L13 8" fill="none" stroke="#7fe0b4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="0" y="14" text-anchor="middle" class="bignum">0</text>
      <text x="0" y="30" text-anchor="middle" class="badgelabel">UPLOADS</text>
    </g>
  </g>

  <!-- floating tool chips -->
  <g transform="translate(636, 126)">
    <g class="rise d7">
      <g class="float-slow">
        <g transform="rotate(-6)">
          <rect x="-56" y="-20" width="126" height="40" rx="20" fill="#0b2017" stroke="#3b8f6a" stroke-opacity="0.55" filter="url(#chipShadow)"/>
          <circle cx="-36" cy="0" r="3.5" fill="#3ecf8e"/>
          <text x="-24" y="5" class="chip">Merge PDF</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(690, 436)">
    <g class="rise d8">
      <g class="float-rev">
        <g transform="rotate(4)">
          <rect x="-58" y="-20" width="128" height="40" rx="20" fill="#0b2017" stroke="#3b8f6a" stroke-opacity="0.55" filter="url(#chipShadow)"/>
          <circle cx="-38" cy="0" r="3.5" fill="#3ecf8e"/>
          <text x="-26" y="5" class="chip">Sign &amp; fill</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(1040, 452)">
    <g class="rise d9">
      <g class="float">
        <g transform="rotate(-3)">
          <rect x="-44" y="-18" width="88" height="36" rx="18" fill="#0b2017" stroke="#3b8f6a" stroke-opacity="0.55" filter="url(#chipShadow)"/>
          <circle cx="-26" cy="0" r="3.5" fill="#3ecf8e"/>
          <text x="-14" y="5" class="chip">OCR</text>
        </g>
      </g>
    </g>
  </g>

  <!-- sparkles -->
  <g class="twinkle" transform="translate(646, 74)">
    <path d="M0 -11 C1.5 -3.5 3.5 -1.5 11 0 C3.5 1.5 1.5 3.5 0 11 C-1.5 3.5 -3.5 1.5 -11 0 C-3.5 -1.5 -1.5 -3.5 0 -11 Z" fill="#e7c98b"/>
  </g>
  <g class="twinkle twinkle-2" transform="translate(1144, 320)">
    <path d="M0 -8 C1 -2.5 2.5 -1 8 0 C2.5 1 1 2.5 0 8 C-1 2.5 -2.5 1 -8 0 C-2.5 -1 -1 -2.5 0 -8 Z" fill="#e7c98b"/>
  </g>

  <rect width="1200" height="520" filter="url(#grain)" opacity="0.035" pointer-events="none"/>
</svg>
