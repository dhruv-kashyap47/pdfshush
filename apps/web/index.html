<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <title>pdfshush: Free, private PDF tools that run in your browser</title>
    <meta
      name="description"
      content="Merge, split, edit, sign and redact PDFs in your browser. Your files never leave your device: nothing is uploaded, stored or seen. Free, no sign-up."
    />
    <meta name="robots" content="index, follow" />

    <style>
      /* Critical fallback only. If a hashed stylesheet is missing after a
         deploy, the document must stay readable instead of collapsing into an
         oversized wordmark. Tailwind loads later and owns the real design. */
      html { background: #000; }
      body {
        margin: 0;
        background: inherit;
        color: #f5f5f5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .brand-mark svg { max-width: 9rem; height: 2rem; }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pdfshush" />
    <meta property="og:title" content="pdfshush: Free, private PDF tools" />
    <meta
      property="og:description"
      content="Merge, split, edit, sign and redact PDFs in your browser. Your files never leave your device: nothing is uploaded, stored or seen. Free, no sign-up."
    />

    <!--
      Order matters for what a crawler can read. Google Search does not accept
      SVG favicons, and a site that offers only /favicon.svg falls back to the
      generic globe in results. /favicon.ico is a real 4-size icon
      (scripts/gen-favicon.mjs), the PNGs cover the "larger than 48px" advice,
      and the SVG stays last for crisp browser tabs.
    -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!--
      Both spellings are needed. The unprefixed name is the standard one, and
      Chrome logs a deprecation warning for a document that declares only the
      `apple-` variant. The `apple-` variant is what iOS Safari actually reads
      for the standalone launch, so it stays.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="pdfshush" />
    <meta name="application-name" content="pdfshush" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
