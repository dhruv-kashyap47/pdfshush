    <style>
      /* Critical fallback only. If a hashed stylesheet is missing after a
         deploy, the document must stay readable instead of collapsing into an
         oversized wordmark. Tailwind loads later and owns the real design. */
      html { background: #000; }
      body {
        margin: 0;
        background: inherit;
        color: #f5f5f5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .brand-mark svg { max-width: 9rem; height: 2rem; }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PDFShush" />
    <meta property="og:title" content="Free Online PDF Tools: Compress, Merge, Edit | PDFShush" />
    <meta
      property="og:description"
      content="Free online PDF tools to compress, merge, split, edit, convert, unlock and sign PDFs in your browser. No signup, no watermark, and your files never leave your device."
    />
    <meta property="og:url" content="https://pdfshush.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free Online PDF Tools: Compress, Merge, Edit | PDFShush" />
    <meta
      name="twitter:description"
      content="Free online PDF tools to compress, merge, split, edit, convert, unlock and sign PDFs in your browser. No signup, no watermark, and your files never leave your device."
    />
    <meta name="twitter:image" content="https://pdfshush.com/og/home.png" />
    <meta name="twitter:image:alt" content="PDFShush free online PDF tools: compress, merge, split and edit PDFs" />

    <!--
      Order matters for what a crawler can read. Google Search does not accept
      SVG favicons, so the ICO is the one file that has to be real: it is a
      4-size icon with PNG payloads (scripts/gen-icons.mjs), which every current
      browser, crawler and desktop shortcut reads. The PNGs cover the larger
      favicon surfaces, and the mark is a painting rather than a vector, so
      there is no SVG to offer.
    -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Both spellings are needed. The unprefixed name is the standard one, and
      Chrome logs a deprecation warning for a document that declares only the
      `apple-` variant. The `apple-` variant is what iOS Safari actually reads
      for the standalone launch, so it stays.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PDFShush" />
    <meta name="application-name" content="PDFShush" />
  </head>
  <body>

    <script type="module" src="/src/main.tsx"></script>
  </body>
